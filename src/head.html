        { "@type": "Question", "name": "Nabízíte i neakreditovanou kalibraci?", "acceptedAnswer": { "@type": "Answer", "text": "V rozsahu naší akreditace ne. Co umíme akreditovaně, děláme akreditovaně — nemusíte tak řešit, kterou variantu si objednat, ani to obhajovat před auditorem. Neakreditovaně kalibrujeme jen to, na co akreditace nedosahuje: relativní vlhkost (5 až 10) % RH, vlhkost při teplotách mimo (10 až 40) °C či jiné veličiny, například proudovou smyčku nebo CO₂. I u nich dokládáme metrologickou návaznost etalonů, jen kalibrační list neobsahuje odkaz na akreditaci." } },
        { "@type": "Question", "name": "Dosud jste nám kalibrovali neakreditovaně. Co se mění?", "acceptedAnswer": { "@type": "Answer", "text": "Laboratoř, přístroje i lidé zůstávají stejní. Nově dostanete kalibrační list s odkazem na akreditaci, tedy doklad, který posoudil Český institut pro akreditaci a který obstojí u auditu." } },
        { "@type": "Question", "name": "Co znamená nejistota měření (k = 2) a proč je důležitá?", "acceptedAnswer": { "@type": "Answer", "text": "Žádné měření není absolutně přesné. Nejistota udává interval, ve kterém se s vysokou pravděpodobností nachází skutečná hodnota. Písmeno k je koeficient rozšíření; k = 2 odpovídá pravděpodobnosti pokrytí přibližně 95 %. Prakticky to znamená toto: pokud naměříme 20,00 °C s nejistotou 0,06 °C, skutečná hodnota leží s 95% pravděpodobností mezi 19,94 a 20,06 °C." } },
        { "@type": "Question", "name": "Kterou nejistotu u svého měřidla dostanu?", "acceptedAnswer": { "@type": "Answer", "text": "U teploty rozhoduje především to, jestli lze teploměr ponořit. Ponořitelné teploměry kalibrujeme v kapalinové lázni, kde je nejistota nejnižší — od 0,06 °C. Pokud měřidlo ponořit nelze, přednostně použijeme generátor vlhkosti; kalibrace je rychlejší a nejistota lepší než v klimatické komoře. Rozměrná měřidla a body mimo rozsah generátoru kalibrujeme v klimatické komoře. U vlhkosti je nejnižší udávaná nejistota 1,1 % RH; podle pásma vlhkosti pak 1,2 nebo 1,8 % RH, jak uvádí příloha osvědčení o akreditaci. Všechny hodnoty v tabulce rozsahu jsou nejnižší udávané. Skutečná nejistota konkrétní kalibrace závisí i na vlastnostech vašeho měřidla a je vždy uvedena v kalibračním listu." } },
        { "@type": "Question", "name": "Co znamená, že je kalibrace akreditovaná?", "acceptedAnswer": { "@type": "Answer", "text": "Že nezávislá třetí strana posoudila naše metody, etalony, podmínky prostředí, výpočty nejistot i způsobilost pracovníků a potvrdila, že v uvedeném rozsahu měříme tak, jak deklarujeme. Akreditace se pravidelně dozoruje, není to jednorázové razítko. Kalibrační list s odkazem na akreditaci proto obstojí tam, kde po vás někdo chce doložit, že kalibraci provedla způsobilá laboratoř. Metrologická návaznost je něco jiného — je to nepřetržitý řetězec kalibrací až k národnímu etalonu. Dokládáme ji u každé zakázky bez ohledu na akreditaci — naše etalony si pravidelně necháváme kalibrovat." } },
        { "@type": "Question", "name": "Platí kalibrační list z české laboratoře i v zahraničí?", "acceptedAnswer": { "@type": "Answer", "text": "Kalibrujeme podle ČSN EN ISO/IEC 17025:2018, což je mezinárodně uznávaná norma, podle které se posuzují kalibrační laboratoře po celém světě. Pokud po vás váš auditor vyžaduje konkrétní doklad o vzájemném uznávání, ozvěte se nám předem a projdeme to s vámi." } },
        { "@type": "Question", "name": "Jak k vám mohu měřidla poslat?", "acceptedAnswer": { "@type": "Answer", "text": "Máte tři možnosti. Pošlete je na naši adresu v Brně, přivezete je osobně, nebo si u nás objednáte svoz — kurýr PPL pak přijede na vámi zvolenou adresu i s přepravní etiketou. Nemusíte tak mít vlastního smluvního přepravce ani nic tisknout, stačí mít zásilku připravenou. Svoz účtujeme jako přepravné tam i zpět. Než balíček vypravíte, dejte nám prosím vědět — potvrdíme vám termín a budeme s vaší zásilkou počítat. Jak měřidla zabalit, aby cestu přežila, jsme sepsali do krátkého návodu ke stažení." } },
        { "@type": "Question", "name": "Můžu měřidla prostě poslat nebo dovézt bez domluvy a avíza?", "acceptedAnswer": { "@type": "Answer", "text": "Vyžadujeme transparentní domluvu předem. Postup je vždy stejný: poptávka kalibrace → naše nabídka → vaše objednávka → doručení měřidel. Díky tomu můžeme lépe plánovat kapacity laboratoře a zajistit co nejrychlejší vyřízení zakázky. Pokud měřidla dodáte bez předchozí domluvy, počítejte s delší dobou vyřízení — a podle rozhodnutí vedoucího laboratoře i s tím, že zakázku nemusíme přijmout vůbec." } },
        { "@type": "Question", "name": "Jak často se má měřidlo kalibrovat?", "acceptedAnswer": { "@type": "Answer", "text": "Platnost kalibrace si stanovuje uživatel měřidla, ne laboratoř — proto na kalibračním štítku uvádíme datum provedené kalibrace, nikoli datum té příští. Nejběžnější je jeden rok, ale záleží na tom, jak je měřidlo namáhané, jak přesné výsledky potřebujete a co po vás žádá váš systém kvality nebo auditor. Řekněte nám v poptávce, jak dlouhou platnost kalibrace u svých měřidel uplatňujete, a termín příští kalibrace ohlídáme za vás — ozveme se šest týdnů předem." } },
        { "@type": "Question", "name": "V kolika bodech nechat měřidlo kalibrovat?", "acceptedAnswer": { "@type": "Answer", "text": "Nejběžnější je kalibrace ve třech bodech: dolní mez, střed a horní mez rozsahu, ve kterém měřidlo skutečně používáte. Není nutné pokrývat celý rozsah měřidla — smysl má kalibrovat tam, kde měříte. Nevíte, které body zvolit? Nechte pole v poptávce prázdné, zeptáme se na váš provoz a body navrhneme." } },
        { "@type": "Question", "name": "Kalibrujete vlhkost i mimo teplotu (10 až 40) °C?", "acceptedAnswer": { "@type": "Answer", "text": "Ano, generátor vlhkosti pracuje v širším teplotním rozsahu. Taková kalibrace ale není předmětem akreditace, takže kalibrační list neobsahuje odkaz na akreditaci. Metrologickou návaznost etalonů dokládáme i u ní. Pokud potřebujete akreditovaný doklad a vaše měřidlo pracuje například v chladicím boxu, ozvěte se — projdeme spolu, jestli lze kalibrační body zvolit tak, aby do rozsahu akreditace spadly." } },
        { "@type": "Question", "name": "Kalibrujete jen čidlo, nebo celý měřicí řetězec?", "acceptedAnswer": { "@type": "Answer", "text": "Měřicí řetězec kalibrujeme jako celek — čidlo, převodník i indikaci. Jinak by výsledek neodpovídal tomu, co na displeji reálně odečítáte, protože odchylku vnáší každý článek řetězce. Posílejte nám proto sestavu pohromadě, včetně kabeláže a indikační jednotky. Výjimkou jsou digitální sondy, například Rotronic. Ty kalibrujeme i samostatně, protože měřená hodnota vzniká přímo v sondě. Případnou justáž navíc uložíme rovnou do sondy, takže si korekci nese s sebou i po přepojení k jiné jednotce." } }
